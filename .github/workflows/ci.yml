name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:

# Never grant more than read access; this workflow only inspects the checkout.
permissions:
  contents: read

# A new push to the same branch cancels the run that is still in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  ci:
    name: Typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Installs the pnpm version declared in package.json ("packageManager").
      # run_install: false keeps dependency installation under our explicit
      # control, in a single step that uses --frozen-lockfile.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm

      - name: Show toolchain versions
        run: node --version && pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # next.config.js sets typescript.ignoreBuildErrors, so `pnpm build` will
      # not fail on type errors. This step is what actually gates them.
      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm run build
